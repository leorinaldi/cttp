[project]
name = "cttp"
version = "0.0.1"
description = "code text transfer protocol — every definition gets an address, references are links"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "httpx>=0.27",
  "tomli-w>=1.0",
  "mcp>=2.1.1",
  "tree-sitter>=0.25,<0.26",  # 0.26.0 crashes on nodes from query captures (P6-T1)
  "tree-sitter-c>=0.24",
]

[project.scripts]
cttp = "cttp.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]
# What the P8-T2 task repositories need at test time (attrs: hypothesis; rich: pygments,
# markdown-it-py; click: nothing). Installed by default so `--check-graders` and the runs work.
bench = ["hypothesis>=6", "pygments>=2.17", "markdown-it-py>=3"]

[tool.uv]
default-groups = ["dev", "bench"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cttp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # the benchmark harness (`bench.agent`) is imported by its tests
addopts = "-m 'not slow'"  # `uv run pytest -m slow` runs the corpus crawl (about two minutes)
markers = [
  "network: the test talks to a closed local port; the no-socket guard is lifted",
  "slow: crawls the driver corpus under bench/ (minutes); deselected by default, skipped when it is not fetched",
]

[tool.ruff]
extend-exclude = ["docs", "bench/drivers/corpus", "bench/agent/repos", "bench/agent/tasks"]  # tasks: fixtures, copied code, deliberately incomplete consumers
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
