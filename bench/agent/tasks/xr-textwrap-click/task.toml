# Cross-repository reuse: the consumer is a small project of this task; the definition comes from
# click at commit 36baa15ff831, checked out beside the agent's working copy as ../deps/click and indexed
# with it. Graded by the hidden tests and by the link check (graders.check_link). The closure is
# five definitions across two files (`_textwrap.py` and `_compat.py`).

name = "xr-textwrap-click"
family = "cross-repo"
summary = "reuse click's ANSI-aware `TextWrapper` (a five-definition closure across two files) in a help renderer"

prompt = """
This small project (`app.py`, tests in `tests/`) needs a new function in `app.py`:

    wrap(text: str, width: int, indent: str = "") -> str

which wraps `text` to at most `width` visible columns and puts `indent` in front of every output
line. ANSI escape sequences (terminal colour codes such as `\\x1b[1m`) in the text do not count
toward the width and are never split across lines; the text's own whitespace is not replaced.

Do not write it from scratch. The `click` library — repository `github.com/pallets/click`, checked
out at commit `36baa15ff831b939a22bc527cd76ce653ef6f66d` in `../deps/click` — has a class `TextWrapper`
that does exactly this. Copy that class, and every definition it depends on, into `app.py` and
use it from the new function. `click` is not a dependency of this project and must not be
imported.

Mark the copied code with cttp links so its origin stays traceable: directly above each copied
definition put a comment line

    # cttp: github.com/pallets/click@36baa15ff831b939a22bc527cd76ce653ef6f66d/<path of the file in that repository>#<name of the definition>

and, if you know the definition's identity hash, append ` id=sha256:<hash>` to the line.

Do not edit the tests. The test command is `python -m pytest -q tests/test_app.py`; run it once
at the end.
"""

[repo]
source = "bench/agent/tasks/xr-textwrap-click/consumer"
locator = "github.com/leorinaldi/xr-textwrap-click"

[[deps]]
name = "click"
source = "bench/agent/repos/click"
locator = "github.com/pallets/click"
url = "https://github.com/pallets/click.git"
rev = "36baa15ff831b939a22bc527cd76ce653ef6f66d"

[grade]
command = "python -m pytest -q tests/test_app.py"
overlay = "grade"
[grade.link]
file = "app.py"
target = "github.com/pallets/click@36baa15ff831b939a22bc527cd76ce653ef6f66d/src/click/_textwrap.py#TextWrapper"

[solution]
overlay = "solution"   # app.py written with `cttp add` plus the wrapper
